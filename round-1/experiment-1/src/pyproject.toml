[project]
name = "qwen3-safety-metrics"
version = "0.2.0"
description = "Single-model internal safety metrics across Qwen3/Qwen2.5 safety-tuned and abliterated lineages (CPU-only adaptation)"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0+cpu",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "loguru==0.7.3",
    "datasets==5.0.1",
    "matplotlib==3.11.2",
    "psutil==7.2.2",
    "huggingface-hub==1.32.0",
    "tokenizers==0.23.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
